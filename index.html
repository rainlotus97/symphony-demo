<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f5f2">
    <title>倒计时 | Symphony Demo</title>
    <link rel="stylesheet" href="style.css">
    <script>
      // 在页面渲染前应用主题，防止闪烁
      (function() {
        try {
          var theme = localStorage.getItem('symphony-theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
          var language = localStorage.getItem('symphony-language');
          if (language === 'zh-CN' || language === 'en') document.documentElement.setAttribute('lang', language);
        } catch (error) {}
      }());
    </script>
</head>
<body>
    <button id="theme-toggle" aria-label="切换深色模式">🌙</button>
    <h1>Welcome to Symphony Demo</h1>
    <p>This project demonstrates autonomous AI coding workflow.</p>

    <nav class="main-nav">
        <h2>功能导航</h2>
        <ul class="nav-list">
            <li class="nav-item">
                <a href="login/login.html" class="nav-link">
                    <span class="nav-icon">🔐</span>
                    <span class="nav-text">登录页面</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="chart/chart.html" class="nav-link">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">图表展示</span>
                </a>
            </li>
        </ul>
    </nav>
    <script src="app.js"></script>
</body>
</html>
